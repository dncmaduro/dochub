services:
  postgres:
    image: postgres:17
    container_name: dochub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dochub
      POSTGRES_USER: dochub
      POSTGRES_PASSWORD: dochub_dev
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    container_name: dochub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  tika:
    image: apache/tika:3.2.3.0-full
    container_name: dochub-tika
    restart: unless-stopped
    ports:
      - "9998:9998"

  onlyoffice:
    image: onlyoffice/documentserver:9.4.0
    container_name: dochub-onlyoffice
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-change-this-local-onlyoffice-jwt-secret}
    ports:
      - "8082:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  redis_data:
